[project]
name = "hibiki-zero"
requires-python = ">= 3.10,<3.14"
description = "Simultaneous Speech-to-Speech Translation Without Aligned Data."
version = "0.0.4"
readme = "README.md"
dependencies = [
    # TODO: use the public release of moshi when it's been published
    "moshi>=0.2.13",
    "gradio>=5.50.0",
    "torch",
    "typer>=0.21.1",
    "aiohttp>=3.11.18",
    "sphn>=0.2.1",
    "sentencepiece>=0.2.1",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff.format]
line-ending = "lf"
# avoid having a trailing comma changing 
# the behavior of the formatter
skip-magic-trailing-comma = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hibiki_zero"]
artifacts = [
    "hibiki_zero/samples/**",
    "hibiki_zero/static/**",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
hibiki-zero = "hibiki_zero.run:cli_app"

[tool.uv]
# System python distribution can have header files missing, so we use only the python
# distributions provided by uv which have everything included.
python-preference = "only-managed"
# moshi pins torch<2.10, but those builds stop at sm_120 and warn on newer GPUs such as
# the GB10 (sm_121). This override only applies to uv, not to pip installs.
override-dependencies = ["torch>=2.10"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
